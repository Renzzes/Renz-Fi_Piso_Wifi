[platformio]
default_envs = freenove_esp32_s3_wroom

; ── W5500-only minimal recovery firmware ─────────────────────────────────────
; Boot → ETH.begin() → MAC → link → IP → simple web server.
; No SD card, CoinManager, MikroTik, portal, or voucher stack.
[env:w5500_minimal]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
monitor_port = COM19
upload_speed = 921600
upload_port = COM19
build_src_filter =
    -<*>
    +<W5500MinimalMain.cpp>
    +<EthernetManager.cpp>
    +<Models.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DETHERNET_LARGE_BUFFERS
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    ; WiFi and lwIP's tiT task are both pinned to CPU0 on this chip
    ; (CONFIG_ESP_WIFI_TASK_PINNED_TO_CORE_0=1, CONFIG_LWIP_TCPIP_TASK_AFFINITY_CPU0=1).
    ; Leaving AsyncTCP's task un-pinned (library default: any core) lets the
    ; scheduler place async_tcp on CPU0 too, where it directly contends with
    ; WiFi AP + lwIP for CPU time — the documented cause of async_tcp
    ; watchdog resets under concurrent AP + Ethernet load. Pin it to CPU1
    ; (the Arduino loopTask's core) instead. See docs/PHASE_9_ETH_AP_COEXISTENCE.md.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=128
lib_ldf_mode = chain
lib_compat_mode = strict
lib_deps =
    ESP32Async/AsyncTCP @ 3.4.10
    ESP32Async/ESPAsyncWebServer @ 3.9.4

; ── Full production firmware (re-enable after W5500 confirmed) ───────────────
[env:freenove_esp32_s3_wroom]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
monitor_port = COM19
upload_speed = 921600
upload_port = COM19
board_build.filesystem = spiffs
board_build.partitions = partitions_custom.csv
extra_scripts =
    pre:extra_scripts/fix_network_includes.py
    pre:extra_scripts/validate_spiffs_data.py
build_src_filter =
    +<*>
    -<W5500MinimalMain.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DETHERNET_LARGE_BUFFERS
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    ; See w5500_minimal env above for why RUNNING_CORE/QUEUE_SIZE are pinned.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=128
    -DLWIP_HOOK_DNS_EXTERNAL_RESOLVE=lwip_hook_dns_external_resolve
    -DRENZFI_DEBUG_SPIFFS=0
    -DRENZFI_DEBUG_STORAGE=0
    -DRENZFI_DEBUG_ROUTER=0
    -DRENZFI_DEBUG_HTTP=0
    -DRENZFI_DEBUG_PORTAL=0
lib_ldf_mode = chain
lib_compat_mode = strict
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2
    ESP32Async/AsyncTCP @ 3.4.10
    ESP32Async/ESPAsyncWebServer @ 3.9.4

; ── Waveshare ESP32-S3-ETH hardware port (Stage 1) ───────────────────────────
; Separate env so Freenove pin map remains the rollback build path.
; Board base: 16 MB flash + 8 MB OPI PSRAM. Keep partitions_custom.csv (8 MB
; layout) for Stage 1 — do not redesign partitions until physical validation.
[env:waveshare_esp32_s3_eth]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32s3_120_16_8-qio_opi
framework = arduino
monitor_speed = 115200
monitor_port = COM19
upload_speed = 921600
upload_port = COM19
board_build.filesystem = spiffs
board_build.partitions = partitions_custom.csv
extra_scripts =
    pre:extra_scripts/fix_network_includes.py
    pre:extra_scripts/validate_spiffs_data.py
build_src_filter =
    +<*>
    -<W5500MinimalMain.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DETHERNET_LARGE_BUFFERS
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=128
    -DLWIP_HOOK_DNS_EXTERNAL_RESOLVE=lwip_hook_dns_external_resolve
    -DRENZFI_BOARD_WAVESHARE_ESP32_S3_ETH
    -DRENZFI_DEBUG_SPIFFS=0
    -DRENZFI_DEBUG_STORAGE=0
    -DRENZFI_DEBUG_ROUTER=0
    -DRENZFI_DEBUG_HTTP=0
    -DRENZFI_DEBUG_PORTAL=0
lib_ldf_mode = chain
lib_compat_mode = strict
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2
    ESP32Async/AsyncTCP @ 3.4.10
    ESP32Async/ESPAsyncWebServer @ 3.9.4

; Installer / field-validation firmware — verbose boot diagnostics
[env:renzfi_installer]
extends = env:freenove_esp32_s3_wroom
build_flags =
    ${env:freenove_esp32_s3_wroom.build_flags}
    -DRENZFI_DEBUG_BOOT=1
    -DRENZFI_DEBUG_SPIFFS=1
    -DRENZFI_DEBUG_PORTAL=1

; Developer firmware — all boot diagnostics enabled
[env:renzfi_developer]
extends = env:freenove_esp32_s3_wroom
build_flags =
    ${env:freenove_esp32_s3_wroom.build_flags}
    -DRENZFI_DEBUG_BOOT=1
    -DRENZFI_DEBUG_SPIFFS=1
    -DRENZFI_DEBUG_STORAGE=1
    -DRENZFI_DEBUG_ROUTER=1
    -DRENZFI_VERBOSE_ROUTER_API=1
    -DRENZFI_DEBUG_HTTP=1
    -DRENZFI_BURN_IN_DIAG=1
