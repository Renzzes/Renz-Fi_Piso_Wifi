[platformio]
default_envs = freenove_esp32_s3_wroom

; ── W5500-only minimal recovery firmware ─────────────────────────────────────
; Boot → ETH.begin() → MAC → link → IP → simple web server.
; No SD card, CoinManager, MikroTik, portal, or voucher stack.
[env:w5500_minimal]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
monitor_port = COM19
upload_speed = 921600
upload_port = COM19
build_src_filter =
    -<*>
    +<W5500MinimalMain.cpp>
    +<EthernetManager.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DETHERNET_LARGE_BUFFERS
lib_ldf_mode = chain
lib_compat_mode = strict
lib_deps =
    ESP32Async/AsyncTCP @ 3.4.10
    ESP32Async/ESPAsyncWebServer @ 3.9.4

; ── Full production firmware (re-enable after W5500 confirmed) ───────────────
[env:freenove_esp32_s3_wroom]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
monitor_port = COM19
upload_speed = 921600
upload_port = COM19
board_build.filesystem = spiffs
board_build.partitions = partitions_custom.csv
extra_scripts = pre:extra_scripts/fix_network_includes.py
build_src_filter =
    +<*>
    -<W5500MinimalMain.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DETHERNET_LARGE_BUFFERS
lib_ldf_mode = chain
lib_compat_mode = strict
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2
    ESP32Async/AsyncTCP @ 3.4.10
    ESP32Async/ESPAsyncWebServer @ 3.9.4
